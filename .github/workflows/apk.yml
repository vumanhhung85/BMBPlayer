# Dựng APK BMBPlayer (vỏ WebView) — chỉ chạy trên nhánh android-apk, không đụng trang web ở main.
# Kết quả: bản CHƯA KÝ đăng ở Release "apk-build"; bản ký (v1+v2) làm ngoài, khoá ký không để trong repo.
name: Build APK
on:
  push:
    branches: [android-apk]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: |
          cd android
          set -o pipefail
          if ! gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log; then
            grep -E "error:|e: |What went wrong|Could not|FAILED|Exception" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk BMBPlayer-unsigned.apk
          gh release delete apk-build -y --cleanup-tag || true
          gh release create apk-build BMBPlayer-unsigned.apk --target "${{ github.sha }}" --prerelease \
            --title "APK build (chưa ký) ${{ github.sha }}" --notes "Bản dựng tự động, chưa ký — không cài trực tiếp."
