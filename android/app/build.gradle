plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.vmh.vmhplayer'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.vmh.vmhplayer'
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {
}
