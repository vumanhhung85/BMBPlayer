plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.boommusicbox.bmbplayer'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.boommusicbox.bmbplayer'
        minSdk 21          // Android 5.0 trở lên (cần WebView cập nhật được)
        targetSdk 34
        versionCode 23
        versionName '2.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Không ký ở đây: bản phát hành được ký ngoài (v1 + v2), khoá ký không để trong repo công khai
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources { excludes += ['META-INF/*.kotlin_module', 'META-INF/versions/**'] }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {
    // WebSocket cho dịch vụ nền chế độ Quầy (2.0). OkHttp 4.12 chạy được từ Android 5.0 (API 21).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
