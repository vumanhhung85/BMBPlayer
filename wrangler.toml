# Worker "bmbplayer" — một Worker cho cả BMBPlayer (chọn bài + gọi lễ tân + quầy + TV)
# Từ 10/2026 Worker này phục vụ LUÔN các trang HTML (static assets), thay GitHub Pages: một lần push = một phiên bản cho cả trang lẫn API.
# Deploy:  npx wrangler deploy        (chạy trong thư mục repo BMBPlayer)
name = "bmbplayer"
main = "bmbplayer-worker.js"
compatibility_date = "2025-01-01"
# Giữ biến đặt trong Dash khi deploy từ GitHub (không có dòng này, mỗi lần deploy sẽ XOÁ biến dạng Text đặt trong Dash).
# Biến bí mật (SECRET, GUEST_SECRET, SESSION_SECRET, APP_PASS) phải đặt loại Secret — loại Secret không bao giờ bị deploy xoá.
keep_vars = true

[vars]
ALLOWED_ORIGINS = "https://bmb.id.vn,https://bmbplayer.vmh.io.vn,https://bmbplayer.boommusicbox.vn,https://bmbplayer.vumanhhung85.workers.dev"
NET_CHECK = "off"          # off = không kiểm mạng | warn = cho vào nhưng đánh dấu máy ngoài mạng quán | on = chặn điện thoại khách ngoài mạng quán
TB_NET = "off"             # on = máy tính bảng phải cùng mạng chi nhánh lúc gán (chi nhánh có 2 đường mạng thì nên để off) | off = bỏ kiểm
TV_NET = "on"              # on = TV chờ gán khác mạng chi nhánh thì hỏi xác nhận (chống gán nhầm TV chi nhánh khác) | off = bỏ kiểm
# Báo cáo sáng (Telegram, 07:55 mỗi ngày): đọc thống kê của hai Worker kho. Mật khẩu kho đặt trong Dash loại SECRET: KHO_VI_PASS, KHO_EN_PASS (cùng mật khẩu anh nhập ở kho.html).
KHO_VI_URL = "https://kho-karaoke.vumanhhung85.workers.dev"
KHO_EN_URL = "https://kho-karaoke-en.vumanhhung85.workers.dev"
# BAO_CAO_SANG = "0"       # bỏ dấu # và đặt "0" để TẮT báo cáo sáng
# Service Binding tới hai Worker kho (Worker gọi Worker qua workers.dev bị Cloudflare chặn → 404). Tên Worker phải ĐÚNG như trong Dash, sai tên thì deploy lỗi.
[[services]]
binding = "KHO_VI"
service = "kho-karaoke"

[[services]]
binding = "KHO_EN"
service = "kho-karaoke-en"

# Cron Trigger: 00:55 UTC = 07:55 giờ Việt Nam → báo cáo sáng (hàm scheduled)
[triggers]
crons = ["55 0 * * *"]

# Trang HTML/ảnh/js ở thư mục gốc repo được phục vụ như file tĩnh (miễn phí, không giới hạn lượt).
# Những file KHÔNG được công khai (code Worker, cấu hình, ghi chú) liệt kê trong .assetsignore.
# html_handling = "none": giữ nguyên đuôi .html (link/QR đã in như remote.html?r=…, quay.html#gan=… không bị đổi thành /remote).
# Đường dẫn không trùng file nào (/api, /ws, /nhac/ws…) tự chuyển vào Worker.
[assets]
directory = "."
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

# Thông tin phiên bản đang chạy (giờ deploy) → TV hiện "Web dd/mm hh:mm" qua /api/ver
[version_metadata]
binding = "CF_VERSION_METADATA"

# D1 dùng chung với app quản lý BMB (database cũ của Order)
# database_id: Cloudflare → Storage & Databases → D1 → bmb_data, hoặc lệnh:  npx wrangler d1 list
[[d1_databases]]
binding = "DB"
database_name = "bmb_data"
database_id = "fecac75f-35ab-47df-85c4-caca0e3ca409"

# R2 riêng cho BMBPlayer (tách khỏi MHPlayer): chứa file APK phát hành từ quay.html → Cài đặt.
# Bật R2 trong Dash → R2 → tạo bucket "bmbplayer-files" TRƯỚC khi deploy, nếu không deploy sẽ lỗi.
[[r2_buckets]]
binding = "FILES"
bucket_name = "bmbplayer-files"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "REG"
class_name = "Registry"

[[durable_objects.bindings]]
name = "NHAC"
class_name = "NhacRoom"

# Chuông thời gian thực của màn quầy (mỗi chi nhánh một bản) — có đơn mới / đổi trạng thái thì quay.html tải lại ngay
[[durable_objects.bindings]]
name = "QHUB"
class_name = "QuayHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Registry", "NhacRoom"]

# 10/2026: thêm QuayHub. KHÔNG sửa/xoá các tag migration đã deploy (v1, v2) — muốn thêm lớp mới thì thêm tag v3.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["QuayHub"]
