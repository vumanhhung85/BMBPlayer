# Worker "bmb-phong" — kênh riêng cho từng phòng (Durable Object + WebSocket)
# Triển khai:  npx wrangler deploy -c wrangler-phong.toml
name = "bmb-phong"
main = "phong-worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://bmbplayer.boommusicbox.vn"
NET_CHECK = "off"          # off = không kiểm mạng | warn = cho vào nhưng đánh dấu máy ngoài mạng quán | on = chặn máy ngoài mạng quán

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "REG"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Registry"]
