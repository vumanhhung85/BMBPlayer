<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMB · Quản lý phòng</title>
<style>
  :root{ --bg:#0a0a0f; --panel:#14141c; --line:#26263a; --ink:#f2f2f7; --quiet:#8a8aa3; --accent:#7c3aed; --accent2:#c084fc; --ok:#22c55e; --warn:#fbbf24; --bad:#ef4444 }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
  header{ display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line) }
  .logo{ width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:grid; place-items:center; font-weight:800 }
  main{ max-width:880px; margin:0 auto; padding:14px 16px 60px }
  .box{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px }
  input{ background:#0e0e16; border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:10px 12px; font-size:15px; min-width:0 }
  button{ background:#20202e; border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:9px 13px; font-size:14px; font-weight:600; cursor:pointer }
  button.pri{ background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none }
  button.bad{ color:#fca5a5 }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .hint{ color:var(--quiet); font-size:13px; margin-top:6px }
  .room{ display:flex; flex-direction:column; gap:10px }
  .room h3{ margin:0; font-size:20px }
  .chip{ font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; background:#20202e }
  .chip.on{ background:#12361f; color:var(--ok) } .chip.off{ background:#3a1515; color:#fca5a5 } .chip.warn{ background:#3a2a10; color:var(--warn) }
  #msg{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#000; border:1px solid var(--line); padding:10px 16px; border-radius:12px; display:none; z-index:9 }
  #qrModal{ position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; z-index:8; padding:16px }
  #qrCard{ background:#fff; color:#111; border-radius:18px; padding:22px; text-align:center; width:min(360px,100%) }
  #qrCard .big{ font-size:56px; font-weight:900; color:#5b21b6; line-height:1.1 }
  #qrCard canvas, #qrCard img{ width:240px; height:240px; image-rendering:pixelated }
  #qrCard .cap{ font:700 16px Arial,sans-serif; color:#5b21b6; margin:6px 0 }
  #qrCard code{ font-size:12px; color:#555; word-break:break-all }
  @media print{ body *{ visibility:hidden } #qrCard, #qrCard *{ visibility:visible } #qrCard{ position:absolute; left:0; top:0; width:100%; border-radius:0 } .noprint{ display:none!important } }
</style>
</head>
<body>
<header><div class="logo">B</div><b>BMB · Quản lý phòng</b></header>
<main>
  <div class="box" id="cfgBox">
    <div class="row">
      <input id="apiUrl" type="url" style="flex:2 1 260px" placeholder="Địa chỉ Worker bmb-phong" autocomplete="off">
      <input id="pass" type="password" style="flex:1 1 160px" placeholder="Mật khẩu nhân viên" autocomplete="off">
      <button class="pri" id="save">Vào</button>
    </div>
    <div class="hint" id="netHint"></div>
  </div>

  <div class="box">
    <b>Thêm phòng</b>
    <div class="row" style="margin-top:8px">
      <input id="nBranch" placeholder="Chi nhánh (vd CN03)" maxlength="8" style="width:160px">
      <input id="nName" placeholder="Phòng (vd P01)" maxlength="10" style="width:140px">
      <button id="add">Thêm</button>
    </div>
    <div class="hint">Mã phòng sẽ là CHINHANH-PHONG, ví dụ CN03-P01. Mỗi phòng có 1 liên kết cho TV và 1 mã QR cho khách.</div>
  </div>

  <div id="rooms"></div>
</main>

<div id="qrModal"><div>
  <div id="qrCard">
    <div class="big" id="qrName"></div>
    <div class="cap">Quét mã để chọn bài hát</div>
    <div id="qrBox"></div>
    <code id="qrUrl"></code>
  </div>
  <div class="row noprint" style="justify-content:center; margin-top:12px">
    <button class="pri" id="qrPrint">In thẻ</button><button id="qrCopy">Chép liên kết</button><button id="qrClose">Đóng</button>
  </div>
</div></div>
<div id="msg"></div>

<script src="./qrcode.js"></script>
<script>
const $ = id => document.getElementById(id);
const DEFAULT_API = 'https://bmb-phong.vumanhhung85.workers.dev';
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const BASE = location.origin + location.pathname.replace(/[^/]*$/, '');
let cfg = { api:(new URLSearchParams(location.search).get('api') || lsGet('phong_api') || DEFAULT_API).replace(/\/+$/, ''), pass: lsGet('phong_pass') || lsGet('np_pass') || '' };
$('apiUrl').value = cfg.api; $('pass').value = cfg.pass;
let rooms = [], timer = null, mt;
const el = (t, c, x) => { const e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; };
const msg = (t, ms) => { const m = $('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(mt); mt = setTimeout(() => m.style.display = 'none', ms || 3500); };

async function api(act, body){
  const res = await fetch(cfg.api + '/api/phong/' + act, { method: body ? 'POST' : 'GET', headers: Object.assign({ 'x-pass': cfg.pass }, body ? { 'content-type':'application/json' } : {}), body: body ? JSON.stringify(body) : undefined });
  let d = {}; try{ d = await res.json(); }catch(e){}
  if(!res.ok) throw new Error(d.error || ('Lỗi ' + res.status));
  return d;
}
const guestUrl = r => BASE + 'remote.html?r=' + encodeURIComponent(r.tokQr);
const tvUrl = r => BASE + 'index.html?r=' + encodeURIComponent(r.tokTv);
const hhmm = t => t ? new Date(t).toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' }) : '';

async function load(){
  if(!cfg.pass) return;
  try{
    const d = await api('list'); rooms = d.rooms || [];
    $('netHint').textContent = d.net === 'on' ? 'Kiểm mạng: BẬT — điện thoại phải cùng mạng với TV mới vào được phòng.' : d.net === 'warn' ? 'Kiểm mạng: CẢNH BÁO — vẫn cho vào nhưng đánh dấu máy ngoài mạng quán.' : 'Kiểm mạng: TẮT — khách quét QR là vào được (đổi bằng biến NET_CHECK của Worker).';
    paint();
  }catch(e){ msg(e.message, 5000); }
}
function paint(){
  const box = $('rooms'); box.replaceChildren();
  if(!rooms.length){ box.append(el('div', 'hint', 'Chưa có phòng nào. Thêm phòng đầu tiên ở trên.')); return; }
  rooms.forEach(r => {
    const c = el('div', 'box room'), top = el('div', 'row');
    top.append(el('h3', null, r.id), el('span', 'chip ' + (r.open ? 'on' : 'off'), r.open ? 'Đang mở từ ' + hhmm(r.since) : 'Đóng'),
      el('span', 'chip ' + (r.tv ? 'on' : 'warn'), r.tv ? 'TV đã nối' : 'TV chưa nối'), el('span', 'chip', r.remotes + ' điện thoại'));
    if(r.offNet) top.append(el('span', 'chip warn', r.offNet + ' máy ngoài mạng quán'));
    const act = el('div', 'row');
    const b = (t, cls, fn) => { const x = el('button', cls, t); x.onclick = fn; return x; };
    act.append(
      r.open ? b('Đóng phòng', 'bad', () => run('dong', r, 'Đóng phòng ' + r.id + '? Điện thoại sẽ bị ngắt và hàng chờ bị xoá.')) : b('Mở phòng', 'pri', () => run('mo', r)),
      b('QR cho khách', null, () => showQr(r)),
      b('Chép liên kết TV', null, () => copy(tvUrl(r), 'Đã chép liên kết TV')),
      b('Đổi mã QR', null, () => run('doima', r, 'Đổi mã QR phòng ' + r.id + '? Thẻ QR đang dán trên bàn sẽ hết dùng, phải in lại.', { kind:'qr' })),
      b('Đổi mã TV', null, () => run('doima', r, 'Đổi mã TV phòng ' + r.id + '? TV phải mở lại liên kết mới.', { kind:'tv' })),
      b('Xoá phòng', 'bad', () => run('xoa', r, 'Xoá phòng ' + r.id + '?')));
    c.append(top, act); box.append(c);
  });
}
async function run(act, r, ask, extra){
  if(ask && !confirm(ask)) return;
  try{ await api(act, Object.assign({ id:r.id }, extra || {})); msg('Xong'); await load(); }catch(e){ msg(e.message, 5000); }
}
async function copy(t, ok){ try{ await navigator.clipboard.writeText(t); msg(ok); }catch(e){ prompt('Chép liên kết:', t); } }

let curQr = null;
function showQr(r){
  curQr = guestUrl(r);
  const q = qrcode(0, 'M'); q.addData(curQr); q.make();
  const box = $('qrBox'); box.replaceChildren();
  const img = document.createElement('img'); img.alt = 'QR'; img.src = q.createDataURL(8, 4); box.append(img);
  $('qrName').textContent = r.name || r.id; $('qrUrl').textContent = '';
  $('qrModal').style.display = 'flex';
}
$('qrClose').onclick = () => { $('qrModal').style.display = 'none'; };
$('qrPrint').onclick = () => window.print();
$('qrCopy').onclick = () => copy(curQr, 'Đã chép liên kết khách');

$('save').onclick = () => {
  cfg.api = $('apiUrl').value.trim().replace(/\/+$/, ''); cfg.pass = $('pass').value;
  lsSet('phong_api', cfg.api); lsSet('phong_pass', cfg.pass); load();
};
$('add').onclick = async () => {
  try{ const d = await api('tao', { branch:$('nBranch').value, name:$('nName').value }); msg('Đã thêm ' + d.room.id); $('nName').value = ''; load(); }catch(e){ msg(e.message, 5000); }
};
load(); timer = setInterval(() => { if(document.visibilityState === 'visible') load(); }, 5000);
</script>
</body>
</html>
